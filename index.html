<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כפר איילים יכיני - Alias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Heebo', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .glow {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.4;
    }

    .glow1 {
      background: #8b5cf6;
      top: -80px;
      right: -100px;
    }

    .glow2 {
      background: #06b6d4;
      bottom: -100px;
      left: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 850px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      color: white;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .title h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .title p {
      color: #cbd5e1;
      margin-top: 8px;
      font-size: 1rem;
    }

    .timer {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 16px 24px;
      border-radius: 20px;
      text-align: center;
      min-width: 130px;
    }

    .timer span {
      display: block;
      font-size: 2.2rem;
      font-weight: 900;
    }

    .card {
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 60px 20px;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    .category {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .word {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .hint {
      color: #cbd5e1;
      font-size: 1.05rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .next-btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      box-shadow: 0 10px 30px rgba(139,92,246,0.35);
    }

    .correct-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 10px 30px rgba(34,197,94,0.35);
    }

    .restart-btn {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .bottom {
      margin-top: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .score {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px 24px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 1.1rem;
    }

    .score span {
      font-size: 2rem;
      font-weight: 900;
      margin-right: 8px;
    }

    .game-over {
      margin-top: 25px;
      padding: 22px;
      border-radius: 24px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      display: none;
      text-align: center;
    }

    .game-over h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    @media(max-width: 700px) {
      .container {
        padding: 24px;
      }

      .title h1 {
        font-size: 2.2rem;
      }

      .word {
        font-size: 2.8rem;
      }

      .top {
        flex-direction: column;
        align-items: stretch;
      }

      .timer {
        width: 100%;
      }
    }
  /* Splash animation */
    #splash button:hover {
      transform: scale(1.05);
    }

    .fade-in {
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

/* BACKGROUND SLIDER */
    .bg-slider {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5) blur(2px);
      transition: opacity 1s ease;
    }

    .container {
      position: relative;
      z-index: 2;
    }

</style>
</head>
<body>

  <div class="bg-slider">
    <img id="bg" src="image/img1.jpeg" />
  </div>

  <!-- Splash Screen -->
  <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);color:white;text-align:center;">
    <div style="font-size:3rem;font-weight:900;margin-bottom:10px;">🏡 כפר איילים יכיני</div>
    <div style="color:#cbd5e1;margin-bottom:30px;">משחק אליאס של הכפר 🎮</div>
    <button onclick="enterGame()" style="padding:18px 40px;font-size:1.5rem;font-weight:900;border:none;border-radius:20px;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white;box-shadow:0 10px 30px rgba(139,92,246,0.35);transform:scale(1);transition:0.2s;">🚀 Start</button>
  </div>


  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="container">
    <div class="top">
      <div class="title">
        <h1>כפר איילים יכיני !</h1>
        <p>משחק אליאס קבוצתי עם לוח ניקוד ותורות 🎯</p>
      </div>

      <div class="timer">
        זמן
        <span id="timer">60</span>
      </div>
    </div>

    <div class="card">
      <div class="category" id="category">קטגוריה: כללי</div>
      <div class="word" id="word">❓</div>
      <div class="hint">לחצו על "התחל משחק" כדי להתחיל את הטיימר ולקבל מילה</div>
    </div>

    <div class="buttons">
      <button class="next-btn" onclick="randomStartTeam()">🎲 הגרלת קבוצה מתחילה</button>
      <button class="next-btn" onclick="nextWord(true)">🎲 מילה הבאה</button>
      <button class="correct-btn" onclick="addPoint()">✅ ניחשו נכון</button>
      <button class="restart-btn" onclick="restartGame()">🔄 משחק חדש</button>
    </div>

    <div class="bottom">
      <div class="score">
        קבוצה אדומה:
        <span id="score1">0</span>
      </div>

      <div class="score">
        קבוצה כחולה:
        <span id="score2">0</span>
      </div>
    </div>

    <div style="margin-top:30px;">
      <h2 style="margin-bottom:15px;">🎲 לוח המשחק</h2>

      <div id="board" style="display:grid;grid-template-columns:repeat(10,1fr);gap:10px;">
      </div>
    </div>

    <div style="margin-top:30px;background:rgba(255,255,255,0.08);padding:22px;border-radius:24px;border:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;">
      <div>
        <div style="color:#cbd5e1;font-size:0.95rem;">התור של</div>
        <div id="currentTeam" style="font-size:2rem;font-weight:900;">🔴 קבוצה אדומה</div>
      </div>

      <button class="next-btn" onclick="startRound()">▶️ התחל תור</button>
    </div>

    <div class="game-over" id="gameOver">
      <h2>⏰ הזמן נגמר!</h2>
      <p>הצלחתם להשיג <strong id="finalScore">0</strong> נקודות</p>
    </div>
  </div>

  <script>
    const words = [
      { word: "ראש כפר", category: "כפר איילים" },
      { word: "שכונה דתית", category: "כפר איילים" },
      { word: "שכונה חילונית", category: "כפר איילים" },
      { word: "מנהל פאב", category: "כפר איילים" },
      { word: "חדר כביסה", category: "כפר איילים" },
      { word: "שינשינים", category: "כפר איילים" },
      { word: "פאב", category: "כפר איילים" },

      { word: "מטוס", category: "תחבורה" },
      { word: "רכבת", category: "תחבורה" },
      { word: "אופניים", category: "תחבורה" },
      { word: "אוטובוס", category: "תחבורה" },
      { word: "מונית", category: "תחבורה" },
      { word: "סירה", category: "תחבורה" },
      { word: "אונייה", category: "תחבורה" },
      { word: "מסוק", category: "תחבורה" },
      { word: "קורקינט", category: "תחבורה" },
      { word: "רכבל", category: "תחבורה" },

      { word: "כלב", category: "חיות" },
      { word: "חתול", category: "חיות" },
      { word: "פיל", category: "חיות" },
      { word: "אריה", category: "חיות" },
      { word: "נמר", category: "חיות" },
      { word: "ג׳ירפה", category: "חיות" },
      { word: "דולפין", category: "חיות" },
      { word: "כריש", category: "חיות" },
      { word: "קוף", category: "חיות" },
      { word: "צב", category: "חיות" },
      { word: "ינשוף", category: "חיות" },
      { word: "נחש", category: "חיות" },
      { word: "תרנגול", category: "חיות" },
      { word: "פרה", category: "חיות" },
      { word: "כבשה", category: "חיות" },

      { word: "פיצה", category: "אוכל" },
      { word: "שווארמה", category: "אוכל" },
      { word: "המבורגר", category: "אוכל" },
      { word: "סושי", category: "אוכל" },
      { word: "פלאפל", category: "אוכל" },
      { word: "במבה", category: "אוכל" },
      { word: "שוקולד", category: "אוכל" },
      { word: "גלידה", category: "אוכל" },
      { word: "פנקייק", category: "אוכל" },
      { word: "סלט", category: "אוכל" },
      { word: "לחם", category: "אוכל" },

      { word: "אייפון", category: "טכנולוגיה" },
      { word: "מחשב", category: "טכנולוגיה" },
      { word: "טאבלט", category: "טכנולוגיה" },
      { word: "מקלדת", category: "טכנולוגיה" },
      { word: "עכבר", category: "טכנולוגיה" },
      { word: "מסך", category: "טכנולוגיה" },
      { word: "רחפן", category: "טכנולוגיה" },
      { word: "רובוט", category: "טכנולוגיה" },
      { word: "מטען", category: "טכנולוגיה" },
      { word: "סוללה", category: "טכנולוגיה" },

      { word: "כדורגל", category: "ספורט" },
      { word: "כדורסל", category: "ספורט" },
      { word: "טניס", category: "ספורט" },
      { word: "שחייה", category: "ספורט" },
      { word: "ריצה", category: "ספורט" },
      { word: "אופניים", category: "ספורט" },
      { word: "גלישה", category: "ספורט" },
      { word: "כושר", category: "ספורט" },

      { word: "ירושלים", category: "ערים" },
      { word: "תל אביב", category: "ערים" },
      { word: "חיפה", category: "ערים" },
      { word: "נתניה", category: "ערים" },
      { word: "פריז", category: "ערים" },
      { word: "לונדון", category: "ערים" },
      { word: "ניו יורק", category: "ערים" },

      { word: "גיטרה", category: "מוזיקה" },
      { word: "פסנתר", category: "מוזיקה" },
      { word: "תופים", category: "מוזיקה" },
      { word: "כינור", category: "מוזיקה" },
      { word: "שיר", category: "מוזיקה" },

      { word: "מורה", category: "מקצועות" },
      { word: "רופא", category: "מקצועות" },
      { word: "שוטר", category: "מקצועות" },
      { word: "כבאי", category: "מקצועות" },
      { word: "מהנדס", category: "מקצועות" },

      { word: "דרקון", category: "פנטזיה" },
      { word: "קוסם", category: "פנטזיה" },
      { word: "פיה", category: "פנטזיה" },
      { word: "טירה", category: "פנטזיה" },

      { word: "שמיים", category: "טבע" },
      { word: "ים", category: "טבע" },
      { word: "הר", category: "טבע" },
      { word: "יער", category: "טבע" },
      { word: "פרח", category: "טבע" },
      { word: "עץ", category: "טבע" },

      { word: "חולצה", category: "לבוש" },
      { word: "מכנסיים", category: "לבוש" },
      { word: "נעליים", category: "לבוש" },
      { word: "כובע", category: "לבוש" },

      { word: "טלפון", category: "בית" },
      { word: "מיטה", category: "בית" },
      { word: "שולחן", category: "בית" },
      { word: "כיסא", category: "בית" },
      { word: "מקרר", category: "בית" },

      { word: "כיתה", category: "לימודים" },
      { word: "מחברת", category: "לימודים" },
      { word: "מבחן", category: "לימודים" },
      { word: "ספר", category: "לימודים" },

      { word: "פופקורן", category: "אוכל" },
      { word: "קולה", category: "אוכל" },
      { word: "מים", category: "אוכל" },
      { word: "תה", category: "אוכל" },
      { word: "קפה", category: "אוכל" }
    ];

    let usedWords = [];

    let currentIndex = 0;
    let score1 = 0;
    let score2 = 0;
    let currentTeam = 1;
    let gameStarted = false;
      currentTeam = 1;
    let positions = {
      1: 0,
      2: 0
    };
    let timeLeft = 60;
    let timerStarted = false;
    let gameEnded = false;
    let timer;

    function randomWord() {
      const availableWords = words.filter(item => !usedWords.includes(item.word));

      if (availableWords.length === 0) {
        usedWords = [];
        return words[Math.floor(Math.random() * words.length)];
      }

      const selected = availableWords[Math.floor(Math.random() * availableWords.length)];

      usedWords.push(selected.word);

      return selected;
    }

    function nextWord(skip = false) {
      if (gameEnded) return;

      if (!timerStarted) {
        return;
      }

      if (skip) {
        if (currentTeam === 1 && score1 > 0) {
          score1--;
          positions[1] = Math.max(0, positions[1] - 1);
          document.getElementById('score1').textContent = score1;
        }

        if (currentTeam === 2 && score2 > 0) {
          score2--;
          positions[2] = Math.max(0, positions[2] - 1);
          document.getElementById('score2').textContent = score2;
        }

        renderBoard();
      }

      const selected = randomWord();

      document.getElementById('word').textContent = selected.word;
      document.getElementById('category').textContent = 'קטגוריה: ' + selected.category;
    }

    function addPoint() {
      if (gameEnded) return;

      if (currentTeam === 1) {
        score1++;
        positions[1]++;
        document.getElementById('score1').textContent = score1;
      } else {
        score2++;
        positions[2]++;
        document.getElementById('score2').textContent = score2;
      }

      renderBoard();
      nextWord();
    }

    function switchTeam() {
      currentTeam = currentTeam === 1 ? 2 : 1;

      document.getElementById('currentTeam').textContent = currentTeam === 1
        ? '🔴 קבוצה אדומה'
        : '🔵 קבוצה כחולה';
    }

    function randomStartTeam() {
      if (gameStarted) return;

      currentTeam = Math.random() < 0.5 ? 1 : 2;
      gameStarted = true;

      document.getElementById('currentTeam').textContent = currentTeam === 1
        ? '🔴 קבוצה אדומה התחילה!'
        : '🔵 קבוצה כחולה התחילה!';
    }

    function startRound() {
      if (!gameStarted || gameEnded || timerStarted) return;

      startGame();
    }

    function startGame() {
      if (timerStarted || gameEnded) return;

      startTimer();
      nextWord();
    }

    function startTimer() {
      timerStarted = true;

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);

      timerStarted = false;

      if (currentTeam === 1) {
        switchTeam();

        timeLeft = 60;
        document.getElementById('timer').textContent = timeLeft;
        document.getElementById('word').textContent = '❓';

        alert('🔵 עכשיו התור של הקבוצה הכחולה!');
      } else {
        gameEnded = true;

        document.getElementById('finalScore').textContent = `🔴 ${score1} | 🔵 ${score2}`;
        document.getElementById('gameOver').style.display = 'block';
      }
    }

    function restartGame() {
      clearInterval(timer);

      score1 = 0;
      score2 = 0;
      positions = { 1: 0, 2: 0 };
      usedWords = [];
      currentTeam = 1;
      timeLeft = 60;
      timerStarted = false;
      gameEnded = false;

      document.getElementById('score1').textContent = score1;
      document.getElementById('score2').textContent = score2;
      document.getElementById('timer').textContent = timeLeft;
      document.getElementById('gameOver').style.display = 'none';

      document.getElementById('currentTeam').textContent = 'ממתין להגרלה 🎲';

      renderBoard();

      document.getElementById('word').textContent = '❓';
      document.getElementById('category').textContent = 'קטגוריה: כללי';
    }
  function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      for (let i = 0; i < 30; i++) {
        const cell = document.createElement('div');

        cell.style.height = '60px';
        cell.style.borderRadius = '16px';
        cell.style.background = 'rgba(255,255,255,0.08)';
        cell.style.border = '1px solid rgba(255,255,255,0.08)';
        cell.style.display = 'flex';
        cell.style.alignItems = 'center';
        cell.style.justifyContent = 'center';
        cell.style.fontWeight = '900';
        cell.style.fontSize = '1.2rem';

        let content = i + 1;

        if (positions[1] === i) {
          content += ' 🔴';
        }

        if (positions[2] === i) {
          content += ' 🔵';
        }

        cell.textContent = content;

        board.appendChild(cell);
      }
    }

    renderBoard();
  function enterGame() {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      splash.style.transition = '0.5s ease';

      setTimeout(() => {
        splash.style.display = 'none';
      }, 500);
    }

// BACKGROUND SLIDER
    const images = [
      "image/img1.jpeg",
      "image/img2.jpeg",
      "image/img3.jpeg",
      "image/img4.jpeg",
      "image/img5.jpeg",
      "image/img6.jpeg",
      "image/img7.jpeg",
      "image/img8.jpeg",
      "image/img9.jpeg",
      "image/img10.jpeg",
      "image/img11.jpeg",
      "image/img12.jpeg",
      "image/img13.jpeg",
      "image/img14.jpeg",
      "image/img15.jpeg"
    ];

    let bgIndex = 0;
    const bg = document.getElementById("bg");

    function changeBg() {
      bg.style.opacity = 0;

      setTimeout(() => {
        bgIndex = (bgIndex + 1) % images.length;
        bg.src = images[bgIndex];
        bg.style.opacity = 1;
      }, 500);
    }

    setInterval(changeBg, 4000);

</script>
</body>
</html>
